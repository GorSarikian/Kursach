version: "3.8"
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    deploy:
      placement:
        constraints: [node.labels.iam_db == true]
    secrets: [db_password]
    networks: [data]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 12
  keycloak:
    image: ${IAM_IMAGE:-iam-course/keycloak:local}
    environment:
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: https://iam.test:8443
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: lab-admin
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx512m"
    deploy:
      replicas: ${IAM_REPLICAS:-2}
      placement:
        max_replicas_per_node: 1
      update_config:
        parallelism: 1
        order: stop-first
        delay: 10s
        monitor: 180s
        failure_action: rollback
    secrets:
      - db_password
      - admin_password
      - source: realm
        target: /opt/keycloak/data/import/iam-realm.json
    networks: [identity, data]
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; read -r line <&3; [[ $$line == *' 200 '* ]]"]
      start_period: 150s
      interval: 10s
      timeout: 4s
      retries: 3
  edge:
    image: nginx:1.28-alpine
    ports:
      - target: 8443
        published: 8443
        protocol: tcp
        mode: ingress
    secrets: [tls_cert, tls_key]
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    networks:
      identity:
        aliases: [iam.test]
      app: {}
  auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    command: ["--config=/etc/iam-oauth2.cfg"]
    secrets: [ca_cert, oidc_secret, cookie_secret]
    configs:
      - source: oauth2_cfg
        target: /etc/iam-oauth2.cfg
    networks: [identity, app]
  portal:
    image: nginx:1.28-alpine
    configs:
      - source: portal_html
        target: /usr/share/nginx/html/index.html
    networks: [app]
networks:
  identity:
    driver: overlay
    driver_opts:
      encrypted: ""
  app:
    driver: overlay
    driver_opts:
      encrypted: ""
  data:
    driver: overlay
    internal: true
    driver_opts:
      encrypted: ""
volumes:
  pgdata:
configs:
  nginx_conf:
    name: ${IAM_STACK:-iam}_nginx_${IAM_NGINX_REV:-v1}
    file: ./config/nginx.conf
  oauth2_cfg:
    name: ${IAM_STACK:-iam}_auth_${IAM_AUTH_REV:-v1}
    file: ./config/oauth2.cfg
  portal_html:
    name: ${IAM_STACK:-iam}_portal_${IAM_PORTAL_REV:-v1}
    file: ./config/portal.html
secrets:
  db_password:
    file: ./.secrets/db_password
  admin_password:
    file: ./.secrets/admin_password
  ca_cert:
    file: ./.secrets/ca_cert
  tls_cert:
    file: ./.secrets/tls_cert
  tls_key:
    file: ./.secrets/tls_key
  oidc_secret:
    file: ./.secrets/oidc_secret
  cookie_secret:
    file: ./.secrets/cookie_secret
  realm:
    file: ./.secrets/iam-realm.json
