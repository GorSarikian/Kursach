resolver 127.0.0.11 valid=5s ipv6=off;
ssl_certificate /run/secrets/tls_cert;
ssl_certificate_key /run/secrets/tls_key;
ssl_protocols TLSv1.2 TLSv1.3;
log_format iam '$remote_addr $request_method $uri $status';
server {
    access_log /var/log/nginx/access.log iam;
    listen 8443 ssl default_server;
    server_name _;
    return 421;
}
server {
    access_log /var/log/nginx/access.log iam;
    listen 8443 ssl;
    server_name iam.test;
    location / {
        set $upstream keycloak:8080;
        proxy_pass http://$upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
server {
    access_log /var/log/nginx/access.log iam;
    listen 8443 ssl;
    server_name portal.test;
    location / {
        set $upstream auth:4180;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_pass http://$upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
