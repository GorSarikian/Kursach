provider = "oidc"
oidc_issuer_url = "https://iam.test:8443/realms/iam"
client_id = "portal"
client_secret_file = "/run/secrets/oidc_secret"
cookie_secret_file = "/run/secrets/cookie_secret"
provider_ca_files = ["/run/secrets/ca_cert"]
http_address = "0.0.0.0:4180"
redirect_url = "https://portal.test:8443/oauth2/callback"
email_domains = ["lab.example"]
allowed_groups = ["/portal-users"]
scope = "openid profile email"
code_challenge_method = "S256"
insecure_oidc_skip_nonce = false
upstreams = ["http://portal:80/"]
reverse_proxy = true
skip_provider_button = true
cookie_name = "__Host-iam_session"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "15m"
cookie_refresh = "1m"
request_logging = false
